name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Если исходники лежат в репозитории архивом (удобно загружать с телефона) — распаковываем.
      - name: Распаковать antarkt.zip
        run: if [ -f antarkt.zip ]; then unzip -o -q antarkt.zip; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Логика расписания: крайние случаи (полночь, выходные, каникулы, замены...)
      - name: Тесты логики (JavaScript)
        run: node tests/logic.test.js
        env:
          TZ: Asia/Yekaterinburg

      - name: Тесты логики (Java, виджет и уведомления)
        run: |
          javac -encoding UTF-8 -d build/logic-tests \
            app/src/main/java/ru/antarkt/Model.java \
            app/src/main/java/ru/antarkt/ScheduleLogic.java \
            tests/java/ScheduleLogicTest.java
          java -Duser.timezone=Asia/Yekaterinburg -cp build/logic-tests ru.antarkt.ScheduleLogicTest

      # Постоянный ключ подписи из секретов репозитория.
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета KEYSTORE_BASE64. Создайте ключ и добавьте секреты — инструкция в README.md"
            exit 1
          fi
          # Пробелы и переносы строк, попавшие при копировании с телефона, убираем.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/antarkt.jks"
          if [ "$(stat -c%s "$RUNNER_TEMP/antarkt.jks")" -lt 2000 ]; then
            echo "::error::Ключ из секрета KEYSTORE_BASE64 слишком короткий — скорее всего, строка скопировалась не целиком"
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/antarkt.jks" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Сборка подписанного APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Имя файла с версией
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Antarkt-2.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Antarkt-2.0.${{ github.run_number }}
          path: out/*.apk
